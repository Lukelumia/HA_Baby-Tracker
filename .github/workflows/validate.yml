name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      # Deliberately not the version pinned by the test harness: this installs
      # the current Home Assistant release and loads the integration the way a
      # HACS install would, so an upstream breaking change surfaces here (the
      # weekly schedule above catches it even without a push).
      - run: uv run --no-project --python 3.14 --with homeassistant python scripts/smoke_test.py
