# Dev checklist only: this is a custom integration, so `quality_scale` is not
# declared in manifest.json. Statuses reflect the state of the code.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: Needs a logo/icon PR against home-assistant/brands.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: No third-party requirements; the client is vendored in api.py.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Cloud polling only; entities subscribe to the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: There is no options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: Good coverage of api/models/config flow; not measured against 95%.

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: A cloud account cannot be discovered on the network.
  discovery:
    status: exempt
    comment: A cloud account cannot be discovered on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: >-
      Entities are only created for record types the account actually holds, so
      there are no permanently unknown entities to disable.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: todo
    comment: Icons are set on the entity descriptions instead of icons.json.
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: Nothing the user can fix beyond re-authentication.
  stale-devices:
    status: todo
    comment: A deleted baby leaves its device behind.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: No py.typed / mypy run in CI yet.
