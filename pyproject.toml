[project]
name = "babytracker"
version = "0.1.0"
description = "Home Assistant custom integration for the Baby Tracker (Nighp) app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
# The integration's own runtime requirements are declared in
# custom_components/babytracker/manifest.json — Home Assistant installs those
# itself (with uv) when the integration is set up.
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component",
  "ruff>=0.16.3",
]

[tool.uv]
# This repository is not a distributable package: Home Assistant loads
# custom_components/babytracker straight from the config directory.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Trimmed version of the Home Assistant core ruff configuration, so this custom
# integration is linted the same way a core integration would be.
[tool.ruff.lint]
select = [
  "A001",   # Variable shadowing a Python builtin
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C",      # complexity
  "D",      # docstrings
  "E",      # pycodestyle
  "F",      # pyflakes
  "FLY",    # flynt
  "G",      # flake8-logging-format
  "I",      # isort
  "INP",    # flake8-no-pep420
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "N804",   # First argument of a class method should be named cls
  "N805",   # First argument of a method should be named self
  "N806",   # Variable in function should be snake_case
  "N815",   # Variable in class scope should not be mixedCase
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-pathlib
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # ruff-specific rules
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "SLOT",   # flake8-slots
  "T20",    # flake8-print
  "TID",    # tidy imports
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "W",      # pycodestyle
]

ignore = [
  "B008",    # Function call in argument defaults; common in Home Assistant
  "D202",    # No blank lines allowed after function docstring
  "D203",    # 1 blank line required before class docstring
  "D213",    # Multi-line docstring summary should start at the second line
  "D417",    # Missing argument descriptions in docstring
  "E501",    # Line too long (handled by the formatter)
  "PLR0913", # Too many arguments to function call
  "PLR2004", # Magic value used in comparison
  "PT011",   # pytest.raises is too broad
  "RUF012",  # Mutable class attributes should be annotated with ClassVar
  "SIM102",  # Use a single if statement instead of nested if statements
  "SIM108",  # Use ternary operator instead of if-else-block
  "TRY003",  # Avoid specifying long messages outside the exception class
  "TRY400",  # Use logging.exception instead of logging.error
  # Conflict with the formatter
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC001",
  "Q",
  "W191",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]
# Standalone CI script: it is not a package and reporting is its whole job.
"scripts/*" = ["INP001", "T20"]
